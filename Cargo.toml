[package]
name = "tuicli"
version = "0.1.0"
edition = "2024"
authors = ["qalmurri <blog.qalmurri@gmail.com>"]
description = "A Rust-based TUI desktop environment designed specifically for headless Linux CLI systems (systems without a GUI). Its development focuses entirely on kernel-level stability, exceptional resource efficiency, ease of use, and reliable operation directly from the terminal, without reliance on heavy graphics servers"
license = "MIT"
repository = "https://github.com/qalmurri/tuicli"
readme = "README.md"
keywords = ["tui", "cli", "desktop", "terminal", "linux"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
portable-pty = "0.9"
vt100 = "0.16"
