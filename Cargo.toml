[package]
name = "tuicli"
version = "0.1.2"
edition = "2024"
authors = ["qalmurri <blog.qalmurri@gmail.com>"]
description = "A lightweight Rust-based TUI desktop environment for Linux CLI systems. Provides terminal window management, workspaces, and interactive shell sessions without requiring Xorg or Wayland"
license = "MIT"
repository = "https://github.com/qalmurri/tuicli"
readme = "README.md"
keywords = ["tui", "cli", "desktop", "terminal", "linux"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
portable-pty = "0.9"
vt100 = "0.16"
libc = "0.2"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = ["libc6", "libgcc-s1"]
assets = [
    ["target/release/tuicli", "usr/bin/", "755"],
    ["LICENSE", "usr/share/licenses/tuicli/", "644"],
]
